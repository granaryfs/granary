# The concurrency bans: out of bounds in granary-sim and in
# any code the sim drives. `tokio::spawn` is the fourth of them and is a
# method, so it sits above. `select!` randomises branch order from a
# runtime RNG the sim cannot seed (`Builder::rng_seed` is
# `cfg(tokio_unstable)`), and `join!`/`try_join!` on a current-thread
# runtime poll the first-listed future to completion, so two publishers
# never contend and a race scenario passes without a race in it.
#
# WHERE THIS IS LIVE, AND WHERE IT IS NOT. Live wherever tokio is in the
# crate's graph — granary-client (lib + `gran`), granary-store's test
# targets, and granary-net, which takes tokio directly for the accept
# loop; verified with a positive control in granary-client, which is
# the code the sim drives. granary-net is the one place the bans are
# expected to fire on purpose: it is the layer the sim REPLACES rather
# than drives, so its two spawn sites carry per-site `#[expect]`s with
# reasons instead of being written around. These entries are also live
# in granary-sim: its engine scheduling adapter names Tokio join channels
# and deadline types, while its own seeded poll loop orders every task.
# No Tokio spawning or polling combinator is used by that adapter.
disallowed-macros = [
  { path = "tokio::select", reason = "unseeded branch order; sequence the interleaving in the sim's scheduler" },
  { path = "tokio::join", reason = "degenerate on a current-thread runtime — the first future runs to completion, so nothing contends" },
  { path = "tokio::try_join", reason = "same polling order as join!, so the ban would have a one-word bypass without it" },
]

# Enforced only where the lint is enabled: the crate roots of granary-core,
# -net, -store, -client, -server, -sim and the granary-server and gran
# binaries deny it
# (HashMap iteration order leaks nondeterminism into sim; raw bytes from
# the OS generator are drawn in one sanctioned place).
disallowed-types = [
  { path = "std::collections::HashMap", reason = "BTreeMap or seeded hasher in core" },
  { path = "std::collections::HashSet", reason = "BTreeSet or seeded hasher in core" },
  { path = "std::hash::RandomState", reason = "ambient per-process entropy" },
  # The INVERSE pattern from its six method-row neighbours above:
  # measured, `rand::rngs::OsRng` resolves for granary-conformance/-net/
  # -bench (rand 0.9.5's `os_rng` feature, which proptest's own `std`
  # feature turns on) but NOT for granary-client/granary-store (rand
  # 0.10.2, the version actually in THEIR graph, dropped that path
  # entirely — checked against its source: no `rngs/os.rs`, no
  # re-export). Same shared-boolean reasoning as above: stays flagged.
  { path = "rand::rngs::OsRng", reason = "ambient entropy; use the Rng seam", allow-invalid = true },
  # Banning the TYPE covers `new`, `default` and every other construction.
  # Enforced in each crate root that denies the lint (the core, net,
  # store, client, server and sim libraries, and the granary-server and
  # gran binaries); the one licensed site is OsSecureRandom's `#[expect]`.
  { path = "aws_lc_rs::rand::SystemRandom", reason = "raw random bytes come only from the SecureRandom seam (granary_net::secure_random::OsSecureRandom)" },
]

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true

# The wildcard-import key — carried verbatim from the root config, same
# reasoning as its own comment there. This is a SCALAR key, so
# check-fsguard-sites.sh's check 1 requires it to be `==` the root's
# value, not merely present.
warn-on-all-wildcard-imports = true
