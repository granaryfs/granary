# Own workspace ([workspace] below): libfuzzer-sys + cc must never enter
# the parent lockfile/graph. Own Cargo.lock, committed.

[package]
name = "granary-core-fuzz"
version = "0.0.0"
publish = false
# Stated so `cargo deny check licenses` can read it: these crates ARE
# Apache-2.0 (the SPDX header above, and LICENSES/ via REUSE), but a
# `publish = false` package with no `license` field reports as
# `unlicensed` and failed the gate that never looked here.
license = "Apache-2.0"
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"

[dependencies.granary-core]
path = ".."

[[bin]]
name = "thresh_chunk"
path = "fuzz_targets/thresh_chunk.rs"
test = false
doc = false
bench = false

[[bin]]
name = "grainid_decode"
path = "fuzz_targets/grainid_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_decode"
path = "fuzz_targets/manifest_decode.rs"
test = false
doc = false
bench = false

# Use independent workspace for fuzzers
[workspace]
members = ["."]

