name: Task
description: Track a specific improvement or follow-up.
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the remaining work and link to relevant context.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How to verify it
    validations:
      required: true
