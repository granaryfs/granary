name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:   # full run after runner repairs or a freshness alarm
    inputs:
      posix_conformance:
        description: Run the pinned POSIX selection and unlink control in fuse
        type: boolean
        default: false
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_BUILD_WARNINGS: deny        # covers clippy too; cache-safe
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"
# Forks and maintainer changes run on disposable standard hosted VMs.
# The public workflow guard refuses private runner routes and write permissions.
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { contents: read }
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: classifier and aggregate refusal controls
        run: python3 -I scripts/ci-changes.py --self-test
      - name: classify the merge
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mode=$(python3 -I scripts/ci-changes.py ci-mode --event "$EVENT" --head "$HEAD" --base "$BASE")
          printf 'ci-changes mode=%s\n' "$mode"
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
  lint:
    runs-on: ubuntu-24.04
    # Step caps bound hangs (15 min or less for clippy, doc and fmt).
    # The job cap bounds the whole job, including rust-cache's post-job save.
    timeout-minutes: 40
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with: { persist-credentials: false }
      - name: check runner workspace permissions
        id: workspace-guard
        timeout-minutes: 5
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE"
          while :; do
            case "$(uname -s)" in
              Darwin) mode=$(stat -f '%Op' "$dir") ;;
              Linux) mode=$(stat -c '%a' "$dir") ;;
              *) echo 'unsupported workspace permission venue' >&2; exit 1 ;;
            esac
            if (( (8#$mode & 0022) != 0 && (8#$mode & 01000) == 0 )); then echo "runner $RUNNER_NAME: group/other-writable directory without sticky bit: $dir" >&2; exit 1; fi
            [ "$dir" != / ] || break
            dir=${dir%/*}
            dir=${dir:-/}
          done
      # cache OK in CI lanes; NEVER in release/publish workflows (cache poisoning)
      # cache-bin: false is LOAD-BEARING on a persistent self-hosted runner.
      # The post step otherwise prunes ${CARGO_HOME}/bin and deletes rustup
      # itself, leaving cargo/rustc/rustfmt as dangling symlinks — measured
      # 2026-08-16, toolchain destroyed after ONE job. Harmless on hosted
      # runners, which are discarded anyway, so set it unconditionally.
      # `workspaces` because this job is the only one that builds the
      # four fuzz workspaces, and each is its OWN cargo workspace with
      # its own lockfile and its own `target/`. With the input unset the
      # action defaults to `. -> target` alone, so every fuzz clippy
      # step below paid a FULL uncached build on every PR — the client's
      # worst of all, since that workspace pulls granary-client's whole
      # dependency graph (aws-lc-rs, hyper-rustls, tokio) to reach one
      # anchor-file parser. Same `path -> target` spelling fuzz.yml
      # already uses. Listing `.` explicitly is required: naming any
      # workspace replaces the default rather than adding to it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        timeout-minutes: 15
        with:
          cache-bin: "false"
          workspaces: |
            . -> target
            crates/granary-core/fuzz -> target
            crates/granary-store/fuzz -> target
            crates/granary-client/fuzz -> target
            crates/granary-fuse/fuzz -> target
      - run: cargo fmt --check
        timeout-minutes: 5
      # NOT --all-features: that would build the fips tree (cmake+go+perl)
      # on every merge — the fips LANE covers that feature
      - run: cargo clippy --workspace --all-targets
        timeout-minutes: 15
      - run: cargo doc --workspace --no-deps
        timeout-minutes: 15
        env: { RUSTDOCFLAGS: "-D warnings" }
      - name: Linux rustdoc surface is present
        timeout-minutes: 5
        run: |
          bash scripts/check-linux-rustdoc.sh --self-test
          bash scripts/check-linux-rustdoc.sh "${CARGO_TARGET_DIR:-target}/doc"
      # the fuzz crate is its own workspace: nothing else in PR CI builds
      # it, and the weekly lane auto-disables — a rename would bitrot
      # silently. Stable only; nightly stays weekly.
      # CLIPPY, not `check`: a fuzz crate compiling is not the question.
      # `crates/granary-client/clippy.toml` is the nearest clippy config
      # for the client's fuzz workspace as well, so the filesystem ban
      # governs that crate — and under `cargo check` it never ran there
      # at all.
      - run: cargo clippy --manifest-path crates/granary-core/fuzz/Cargo.toml --all-targets --locked
        timeout-minutes: 15
      - run: cargo clippy --manifest-path crates/granary-store/fuzz/Cargo.toml --all-targets --locked
        timeout-minutes: 15
      - run: cargo clippy --manifest-path crates/granary-client/fuzz/Cargo.toml --all-targets --locked
        timeout-minutes: 15
      - run: cargo clippy --manifest-path crates/granary-fuse/fuzz/Cargo.toml --all-targets --locked
        timeout-minutes: 15
      # THE LINT LANE'S POSITIVE CONTROL. Every step above asks whether
      # the code passes clippy; none asks whether the filesystem ban is
      # still switched on. The gates job's check-fsguard-sites.sh reads
      # the files that would make it fire and cannot see whether clippy
      # loaded any of them. This plants a bare std::fs::create_dir_all
      # in granary-client, runs clippy, requires a
      # clippy::disallowed_methods diagnostic on that exact span, and
      # restores the file. It runs after every clippy step above and before
      # the moved checks below, so their failures cannot skip it. The trap
      # restores the file and the probe verifies the restore, so no plant
      # reaches a later step's build.
      - run: ./scripts/probes/fsguard-dormant-ban-oracle.sh
        timeout-minutes: 15
      # The checks below were separate jobs. Each runs even when an earlier
      # lint step failed, but only once checkout and the workspace
      # permission guard have passed.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        if: ${{ !cancelled() && steps.workspace-guard.outcome == 'success' }}
        timeout-minutes: 5
        with: { advanced-security: false }
      # K2's local leg as a per-merge gate: the pinned portable MinIO
      # binary (SHA-verified by the harness every run), cached by release
      # string.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        if: ${{ !cancelled() && steps.workspace-guard.outcome == 'success' }}
        timeout-minutes: 15
        with: { tool: cargo-nextest@0.9.143 }
      # The pinned action uses node24 and requires runner >= 2.327.1.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && steps.workspace-guard.outcome == 'success' }}
        timeout-minutes: 15
        with:
          path: target/minio/minio-*
          key: minio-RELEASE.2025-09-07T16-13-09Z-linux-amd64
      - run: ./scripts/minio-harness.sh test
        if: ${{ !cancelled() && steps.workspace-guard.outcome == 'success' }}
        timeout-minutes: 15
      - name: derive MSRV from workspace rust-version
        id: msrv
        if: ${{ !cancelled() && steps.workspace-guard.outcome == 'success' }}
        timeout-minutes: 15
        # jq is preinstalled on runners. The .0 suffix is LOAD-BEARING: rust-version
        # is "1.97", but a bare "1.97" toolchain resolves to the latest patch, which
        # stops matching rust-version at the first toolchain bump
        shell: bash
        run: |
          MSRV=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version').0
          [[ $MSRV =~ ^1\.[0-9]+\.0$ ]] || { echo "invalid MSRV toolchain: '$MSRV'" >&2; exit 1; }
          echo "MSRV=$MSRV" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install "$MSRV" --profile minimal
        if: ${{ !cancelled() && steps.workspace-guard.outcome == 'success' }}
        timeout-minutes: 15
        env: { MSRV: "${{ steps.msrv.outputs.MSRV }}" }
      # RUSTUP_TOOLCHAIN is LOAD-BEARING: env outranks rust-toolchain.toml, so
      # without it the step silently checks the pin instead of the MSRV. It is
      # step-scoped so no later lint step runs on the MSRV compiler.
      # CARGO_BUILD_WARNINGS=warn: a compatibility check, not a lint check;
      # older and newer compilers warn differently.
      # The MSRV check, MinIO test build and musl build share lint's rust-cache entry.
      # The first successful lint run that misses the cache key saves their dependencies.
      # Cargo keys artifacts by compiler version, so the MSRV and pinned toolchains
      # use separate artifacts.
      - name: check workspace on MSRV
        if: ${{ !cancelled() && steps.workspace-guard.outcome == 'success' }}
        timeout-minutes: 15
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.MSRV }}
          CARGO_BUILD_WARNINGS: warn
        run: |
          [[ $RUSTUP_TOOLCHAIN =~ ^1\.[0-9]+\.0$ ]] || { echo "invalid MSRV toolchain: '$RUSTUP_TOOLCHAIN'" >&2; exit 1; }
          cargo check --workspace --locked
      # An aarch64 musl leg needs its own job on ubuntu-24.04-arm (GitHub's fleet).
      # Add that job to ci-green's needs and to SKIPPABLE (scripts/ci-changes.py)
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
        if: ${{ !cancelled() && steps.workspace-guard.outcome == 'success' }}
        timeout-minutes: 25
      - run: rustup target add x86_64-unknown-linux-musl
        if: ${{ !cancelled() && steps.workspace-guard.outcome == 'success' }}
        timeout-minutes: 25
      # release profile kept deliberately: CI's only release-profile compile
      # (exercises overflow-checks = true)
      - run: cargo build --release --target x86_64-unknown-linux-musl -p granary-cli -p granary-client -p granary-server
        if: ${{ !cancelled() && steps.workspace-guard.outcome == 'success' }}
        timeout-minutes: 25
      - name: assert static
        if: ${{ !cancelled() && steps.workspace-guard.outcome == 'success' }}
        timeout-minutes: 25
        # x86_64-musl emits static-PIE ("static-pie linked"); aarch64 emits
        # "statically linked" — match both or the x86 leg is red
        run: |
          file target/x86_64-unknown-linux-musl/release/gran | grep -Eq "statically linked|static-pie linked"
          file target/x86_64-unknown-linux-musl/release/granary-server | grep -Eq "statically linked|static-pie linked"
        # NOTE: the server binary carries granary-net (rustls + aws-lc-rs),
        # so this step is the static-link exercise of aws-lc-on-musl.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: record server process baseline
        run: python3 -I scripts/check-server-processes.py begin --state "$RUNNER_TEMP/server-processes.json" --root "$GITHUB_WORKSPACE" --root "$RUNNER_TEMP"
      - name: process cleanup controls
        run: |
          python3 -I scripts/check-server-processes.py self-test --public
          python3 -I scripts/check-server-processes.py live-self-test
      - name: check runner workspace permissions
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE"
          while :; do
            case "$(uname -s)" in
              Darwin) mode=$(stat -f '%Op' "$dir") ;;
              Linux) mode=$(stat -c '%a' "$dir") ;;
              *) echo 'unsupported workspace permission venue' >&2; exit 1 ;;
            esac
            if (( (8#$mode & 0022) != 0 && (8#$mode & 01000) == 0 )); then echo "runner $RUNNER_NAME: group/other-writable directory without sticky bit: $dir" >&2; exit 1; fi
            [ "$dir" != / ] || break
            dir=${dir%/*}
            dir=${dir:-/}
          done
      # cache-bin: false is LOAD-BEARING on a persistent self-hosted runner.
      # The post step otherwise prunes ${CARGO_HOME}/bin and deletes rustup
      # itself, leaving cargo/rustc/rustfmt as dangling symlinks — measured
      # 2026-08-16, toolchain destroyed after ONE job. Harmless on hosted
      # runners, which are discarded anyway, so set it unconditionally.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { cache-bin: "false" }
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with: { tool: cargo-nextest@0.9.143 }
      - name: Require the Linux metrics listener rows
        if: runner.os == 'Linux'
        run: |
          listing=$(cargo nextest list --locked -p granary-net -p granary-cli -p granary-client -E 'test(metrics_linux_)')
          for anchor in \
            'metrics_listener::tests::metrics_linux_tls_head_byte_cap_with_controlled_reads' \
            'metrics_listener::tests::metrics_linux_occupied_and_free_ipv4_ipv6' \
            'metrics_listener::tests::metrics_linux_fifth_connection_closes_and_cancellation_drains' \
            'attach::metrics_export::tests::metrics_linux_occupied_degrades_and_invalid_configuration_refuses' \
            'metrics::tests::metrics_linux_stalled_snapshot_allows_recording_collection_and_cancellation'; do
            printf '%s\n' "$listing" | grep -Eq "^[^[:space:]]+ ${anchor}$"
          done
      - run: cargo nextest run --profile ci --locked
      # The RESOLVED-GRAPH licence-boundary gate: `check-licence-boundary.sh`
      # reads committed TEXT and names what a content scan cannot reach; this
      # reads `cargo metadata`'s resolve graph and rustc's own dep-info,
      # which closes exactly those gaps. It runs here, after nextest, so its
      # default-features build is largely incremental on this job's own; its
      # second build compiles what the non-fips, non-default features add.
      # Self-test first, same shape as every other gate with one.
      - run: python3 -I scripts/check-licence-resolved.py --self-test
      - run: python3 -I scripts/check-licence-resolved.py
      - run: cargo test --doc --locked
      - name: no server may survive this job
        if: always()
        run: python3 -I scripts/check-server-processes.py check --cleanup --state "$RUNNER_TEMP/server-processes.json"
  test-macos:
    runs-on: macos-26
    timeout-minutes: 35
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: record hosted capacity and storage
        run: |
          sw_vers
          uname -m
          sysctl hw.ncpu hw.memsize
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: record server process baseline
        run: python3 -I scripts/check-server-processes.py begin --state "$RUNNER_TEMP/server-processes.json" --root "$GITHUB_WORKSPACE" --root "$RUNNER_TEMP"
      - name: check runner workspace permissions
        id: workspace-guard
        timeout-minutes: 5
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE"
          while :; do
            case "$(uname -s)" in
              Darwin) mode=$(stat -f '%Op' "$dir") ;;
              Linux) mode=$(stat -c '%a' "$dir") ;;
              *) echo 'unsupported workspace permission venue' >&2; exit 1 ;;
            esac
            if (( (8#$mode & 0022) != 0 && (8#$mode & 01000) == 0 )); then echo "runner $RUNNER_NAME: group/other-writable directory without sticky bit: $dir" >&2; exit 1; fi
            [ "$dir" != / ] || break
            dir=${dir%/*}
            dir=${dir:-/}
          done
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with: { tool: cargo-nextest@0.9.143 }
      - run: cargo nextest run --profile ci --locked
      - run: cargo test --doc --locked
      - name: no server may survive this job
        if: always()
        run: python3 -I scripts/check-server-processes.py check --state "$RUNNER_TEMP/server-processes.json"
      - name: record remaining workspace disk
        if: always()
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
  purity:
    runs-on: ubuntu-24.04
    # 10-14 min on main (2026-11-14), mostly check-mount-write-path's self-test,
    # whose cases grow with the refusal catalogue; 15 cancelled loaded runners.
    timeout-minutes: 25
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: check runner workspace permissions
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE"
          while :; do
            case "$(uname -s)" in
              Darwin) mode=$(stat -f '%Op' "$dir") ;;
              Linux) mode=$(stat -c '%a' "$dir") ;;
              *) echo 'unsupported workspace permission venue' >&2; exit 1 ;;
            esac
            if (( (8#$mode & 0022) != 0 && (8#$mode & 01000) == 0 )); then echo "runner $RUNNER_NAME: group/other-writable directory without sticky bit: $dir" >&2; exit 1; fi
            [ "$dir" != / ] || break
            dir=${dir%/*}
            dir=${dir:-/}
          done
      # cache-bin: false is LOAD-BEARING on a persistent self-hosted runner.
      # The post step otherwise prunes ${CARGO_HOME}/bin and deletes rustup
      # itself, leaving cargo/rustc/rustfmt as dangling symlinks — measured
      # 2026-08-16, toolchain destroyed after ONE job. Harmless on hosted
      # runners, which are discarded anyway, so set it unconditionally.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { cache-bin: "false" }
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with: { tool: cargo-deny@0.20.2 }
      - run: ./scripts/check-core-purity.sh
      # The DEPENDENCY axis for granary-vfs (the counterpart to
      # check-vfs-purity.sh's SOURCE axis, in the gates job below): reuses
      # this same deny.core.toml, scoped to granary-vfs's own manifest,
      # plus a one-directional dependency-tree diff against granary-core
      # and a proc-macro check. Self-test first, same shape as the two
      # gates in the gates job.
      - run: ./scripts/check-vfs-deps.sh --self-test
      - run: ./scripts/check-vfs-deps.sh
      # The server's instrumentation floor, enforced on push. It must
      # write to stderr ONLY through the lossy sink (one direct
      # `eprintln!`/`dbg!` from a runtime worker wedges shutdown, which
      # is what the sink exists to prevent), and the per-request span and
      # `served` counter must exist in PRODUCTION code rather than only
      # in comments about it. Reads `crates/granary-server/src` alone,
      # and runs unconditionally on PR, main and nightly CI. The script exits 2
      # ("THE GATE IS BLIND") rather than 0 when what it greps for is absent.
      # A local battery that runs these gates in sequence under `set -e`
      # stops at the first red lane, so after an earlier failure this gate
      # never executes and the server's instrumentation floor goes unchecked.
      # --self-test FIRST, the shape check-unsafe-sites.sh uses. The gate
      # needs a production/test scan ceiling in adapter.rs and accepts
      # EITHER `mod tests {` or `mod tests;`. The live adapter.rs uses the
      # out-of-line `mod tests;` form. S3 proves it fails CLOSED when NEITHER
      # is present; S4a/S4b prove each accepted spelling still finds a ceiling.
      - run: ./scripts/check-server-log-path.sh --self-test
      - run: ./scripts/check-server-log-path.sh
      # No bare standard-stream write anywhere in the closed mount inventory.
      - run: ./scripts/check-mount-write-path.sh --self-test
      - run: ./scripts/check-mount-write-path.sh
      # porcelain, not `git diff --exit-code`: git diff is blind to
      # untracked/deleted files. In a script, and not inline, because
      # `test -z "$(git status …)"` reads a git that could not run as a
      # clean tree.
      #
      - run: ./scripts/check-inventory-fresh.sh
      # AGPL headers only in granary-server, nothing depends on
      # granary-server, and nothing names a path into its directory. The
      # crate has a `[lib]` target, so the dependency check is what keeps an
      # Apache crate from linking it. All three checks live in the script,
      # and its self-test runs it against planted repositories first.
      - run: ./scripts/check-licence-boundary.sh --self-test
      - run: ./scripts/check-licence-boundary.sh
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      # `fetch-depth: 0` is LOAD-BEARING for check-citations.py. It verifies a
      # frozen citation by reading the file AT the sha the freeze names, which
      # needs history; `actions/checkout` defaults to depth 1, and the gate
      # correctly REFUSED rather than certify what it could not read. Proved in
      # a real `git clone --depth 1`: 35 citations reported unverifiable, exit
      # 1, with this flag named in the message.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: check runner workspace permissions
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE"
          while :; do
            case "$(uname -s)" in
              Darwin) mode=$(stat -f '%Op' "$dir") ;;
              Linux) mode=$(stat -c '%a' "$dir") ;;
              *) echo 'unsupported workspace permission venue' >&2; exit 1 ;;
            esac
            if (( (8#$mode & 0022) != 0 && (8#$mode & 01000) == 0 )); then echo "runner $RUNNER_NAME: group/other-writable directory without sticky bit: $dir" >&2; exit 1; fi
            [ "$dir" != / ] || break
            dir=${dir%/*}
            dir=${dir:-/}
          done
      # cache-bin: false is LOAD-BEARING on a persistent self-hosted runner.
      # The post step otherwise prunes ${CARGO_HOME}/bin and deletes rustup
      # itself, leaving cargo/rustc/rustfmt as dangling symlinks — measured
      # 2026-08-16, toolchain destroyed after ONE job. Harmless on hosted
      # runners, which are discarded anyway, so set it unconditionally.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { cache-bin: "false" }
      # Needs no toolchain and runs in a second, so it sits ahead of the
      # cargo installs below and fails fast on wire drift no test in the
      # crate can see.
      #
      # Check protocol constants on every PR, main push and nightly run,
      # including document-only changes.
      - run: python3 -I scripts/check-protocol-constants.py
      # Require read-only hosted execution, including fork pull requests.
      # The private guard fixtures remain part of the public self-test.
      - run: python3 -I scripts/check-fork-guard.py --public --self-test
      - run: python3 -I scripts/check-fork-guard.py --public
      # ShellCheck over every tracked shell script (scripts/check-shellcheck.sh's
      # own header has the discovery rule and the severity choice). Installed
      # from `taiki-e/install-action`'s own supported-tools list (TOOLS.md),
      # the same pinned action every other tool install in this job uses,
      # pinned by VERSION the way `cargo-deny`/`cargo-shear` are below —
      # not a second pinning mechanism. Needs no toolchain either, so it
      # sits beside the protocol-constants gate above rather than waiting
      # for the cargo installs further down. Self-test first, same shape
      # as every other gate in this job.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with: { tool: "shellcheck@0.11.0" }
      - run: ./scripts/check-shellcheck.sh --self-test
      - run: ./scripts/check-shellcheck.sh
      # The gate carries a per-crate table of licensed `#[expect(unsafe_code)]`
      # sites. The self-test runs first: a counter that has stopped
      # counting must fail here, not report agreement it never established.
      - run: ./scripts/check-unsafe-sites.sh --self-test
      - run: ./scripts/check-unsafe-sites.sh
      # crates/granary-client/clippy.toml nests a fs-call ban on top of
      # the workspace root config (a nested config REPLACES, not merges).
      # The self-test runs first, same reasoning as check-unsafe-sites.sh
      # just above.
      - run: ./scripts/check-fsguard-sites.sh --self-test
      - run: ./scripts/check-fsguard-sites.sh
      # The SOURCE axis: granary-vfs's `#![cfg_attr(not(test), no_std)]`
      # is unguarded at the source level — the compiler and this gate are
      # one mechanism. Self-test first, same shape as the two gates above.
      - run: ./scripts/check-vfs-purity.sh --self-test
      - run: ./scripts/check-vfs-purity.sh
      # The ROOT-SHAPE rule: a gated crate's root is NOT frozen at any
      # item count, but its SHAPE is — an allow-list, not
      # check-vfs-purity.sh's subject, which is why this is a separate
      # script. TWO crates (granary-vfs, granary-fuse); the other eight
      # carry no index root. Self-test first, same shape as above.
      - run: ./scripts/check-vfs-root-shape.sh --self-test
      - run: ./scripts/check-vfs-root-shape.sh
      # The file-size trigger: a source file under crates/*/src of more than
      # 3,000 physical lines owes a written disposition or a compiler-proven
      # file-scoped `#![cfg(test)]` shield. Self-test first, same shape as
      # the gates above.
      #
      - run: ./scripts/check-file-dispositions.sh --self-test
      - run: ./scripts/check-file-dispositions.sh
      # The two syscall-trace checkers' paired controls: the FUSE sync wire
      # witness, and authority-venue-strace.py's lifecycle mode. A run against
      # a real trace (the fuse job's wire rows; the authority venue, off CI)
      # cannot show that the checker still refuses a bad one, so a change that
      # broke the controls would otherwise merge green.
      - run: python3 -I scripts/check-fuse-sync-wire.py --self-test
      - run: python3 -I scripts/test-authority-lifecycle-strace.py
      # >>> THREE GATES RUN IN A NON-SHIPPING CI WORKFLOW, NOT IN THIS
      # ONE: the scope-complement gate, the bench-results classifier and
      # the ADR index generator. <<< Each
      # one's SUBJECT is a path that does not ship, so the gate does not ship
      # either, and a step in a SHIPPING workflow cannot invoke a script that
      # is not in the artefact. They are not deleted: the non-shipping CI workflow
      # keeps their CI seat in this repository, and the
      # published one never sees them.
      #
      # Also in docs-gates.yml: document and script changes get the same
      # venue-independent citation controls in both workflows.
      - run: python3 -I scripts/check-citations.py --self-test
      # >>> `--output`, AND THE VENUE IS NAMED BECAUSE IT CANNOT BE INFERRED. <<< This
      # workflow SHIPS, so the step runs in both repositories, and the two have different
      # corpora: `docs/adr/` is half of the live set here and is absent there. The OUTPUT
      # venue is the reading that is TRUE IN BOTH — no citation points past the end of its
      # target, and the corpus is not empty. It carries NO coverage floor, deliberately:
      # measured in the built published tree, 41 of its 67 `.rs` citations are expected-
      # diagnostic strings naming temporary fixture files and can never resolve, so a
      # fraction over that population would be measuring fixture text. The SOURCE venue,
      # with all six thresholds over the private corpus, runs only where that corpus exists.
      #
      # In THIS repository the `--output` run is strictly implied by that one and so carries
      # no information about the corpus. It is kept here anyway because it is the only
      # citation reading the PUBLISHED repository's own CI can perform, and a gate whose only
      # runner is the private exporter cannot protect a public contributor's pull request.
      - run: python3 -I scripts/check-citations.py --output
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with: { tool: "cargo-deny@0.20.2,cargo-shear@1.13.3" }
      - run: cargo deny check
      # The four nested fuzz workspaces have their own locks and are
      # invisible to the bare invocation above (dependency-policy.md:25;
      # the gap had hidden a yanked chacha20 in the client fuzz lock).
      #
      - run: cargo deny --manifest-path crates/granary-core/fuzz/Cargo.toml check
      - run: cargo deny --manifest-path crates/granary-store/fuzz/Cargo.toml check
      - run: cargo deny --manifest-path crates/granary-client/fuzz/Cargo.toml check
      - run: cargo deny --manifest-path crates/granary-fuse/fuzz/Cargo.toml check
      - run: cargo-shear
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
  breakage:
    # The three `conformance-breakage` gates:
    # the feature-on workspace clippy, the
    # feature-on workspace suite (UNFILTERED, with a count guard on the
    # breakage-named set), and the release wall that must FAIL to compile.
    # A separate job from `fuse`, on purpose: these are feature-gated
    # compile/test proofs that need neither root nor a kernel mount, and a
    # FUSE environment failure must not take them down with it. On Linux the
    # feature-on clippy also compiles the `cfg(target_os = "linux")` arming
    # site in the client daemon body, which the macOS copy of this gate
    # structurally cannot reach.
    runs-on: ubuntu-24.04
    # The bound leaves room for load on a shared runner.
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: record server process baseline
        run: python3 -I scripts/check-server-processes.py begin --state "$RUNNER_TEMP/server-processes.json" --root "$GITHUB_WORKSPACE" --root "$RUNNER_TEMP"
      - name: check runner workspace permissions
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE"
          while :; do
            case "$(uname -s)" in
              Darwin) mode=$(stat -f '%Op' "$dir") ;;
              Linux) mode=$(stat -c '%a' "$dir") ;;
              *) echo 'unsupported workspace permission venue' >&2; exit 1 ;;
            esac
            if (( (8#$mode & 0022) != 0 && (8#$mode & 01000) == 0 )); then echo "runner $RUNNER_NAME: group/other-writable directory without sticky bit: $dir" >&2; exit 1; fi
            [ "$dir" != / ] || break
            dir=${dir%/*}
            dir=${dir:-/}
          done
      # cache-bin: false is LOAD-BEARING on a persistent self-hosted runner.
      # The post step otherwise prunes ${CARGO_HOME}/bin and deletes rustup
      # itself, leaving cargo/rustc/rustfmt as dangling symlinks — measured
      # 2026-08-16, toolchain destroyed after ONE job. Harmless on hosted
      # runners, which are discarded anyway, so set it unconditionally.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { cache-bin: "false" }
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with: { tool: cargo-nextest@0.9.143 }
      - run: cargo clippy --workspace --all-targets --features conformance-breakage
      # authority_host spawns gran beside granary-server.
      - run: cargo build --locked -p granary-cli --bin gran
      - name: the breakage-named test set is non-empty, then the feature-on suite runs unfiltered
        # The COUNT guard is defence in depth on the breakage-specific set
        # only (a renamed module going silently uncounted is a real failure
        # mode); the RUN is the whole workspace, unfiltered, because the
        # feature changes the mount path for EVERY caller, not only for
        # tests whose name says "breakage". `cargo nextest list` with a
        # filter matching nothing exits 0, which is why the count is checked
        # by hand; `grep -c` on no match exits 1, which is why it is guarded.
        run: |
          set -euo pipefail
          set +e
          listing=$(cargo nextest list --workspace --locked --features conformance-breakage -E 'test(breakage)' 2>&1)
          list_rc=$?
          set -e
          if [ "$list_rc" -ne 0 ]; then
            echo "cargo nextest list itself failed (rc=$list_rc); this is not the same outcome as the filter selecting nothing:" >&2
            printf '%s\n' "$listing" >&2
            exit 1
          fi
          selected=$(printf '%s\n' "$listing" | grep -c '^granary-' || true)
          # Sanitised before it is compared, exactly as the local mirror does:
          # an empty or non-numeric value makes `[ "$selected" -eq 0 ]` a test
          # ERROR inside an `if`, which errexit exempts — so the zero branch
          # would be skipped and the guard would fail OPEN.
          case "$selected" in
            ''|*[!0-9]*) selected=0 ;;
          esac
          if [ "$selected" -eq 0 ]; then
            echo "-E 'test(breakage)' selected ZERO conformance-breakage tests; the count guard would pass vacuously" >&2
            exit 1
          fi
          echo "breakage-named tests selected: $selected"
          cargo nextest run --workspace --profile ci --locked --features conformance-breakage
      - name: the release wall holds
        # A build-mode ASSERTION: the feature-on release build must FAIL,
        # and the release wall's own compile_error! message must be WHY.
        # A build failing for an unrelated reason must not be accepted as
        # "the wall held". A `case` match rather than a piped grep, so a
        # long log cannot turn the check into a SIGPIPE.
        run: |
          set -euo pipefail
          set +e
          log=$(cargo build --release -p granary-fuse --features conformance-breakage 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "cargo build --release -p granary-fuse --features conformance-breakage SUCCEEDED: the release wall is gone or its cfg predicate no longer matches" >&2
            exit 1
          fi
          case "$log" in
            *'conformance-breakage must never compile into a release binary'*)
              echo "the release wall held: the feature-on release build failed with its own message"
              ;;
            *)
              echo "the release build failed, but NOT with the release wall's message; last lines:" >&2
              printf '%s\n' "$log" | tail -20 >&2
              exit 1
              ;;
          esac
      - name: no server may survive this job
        if: always()
        run: python3 -I scripts/check-server-processes.py check --cleanup --state "$RUNNER_TEMP/server-processes.json"
  publish-restart:
    # The executable is built separately; server dev edges never arm the client.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: record server process baseline
        run: python3 -I scripts/check-server-processes.py begin --state "$RUNNER_TEMP/server-processes.json" --root "$GITHUB_WORKSPACE" --root "$RUNNER_TEMP"
      - name: check runner workspace permissions
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE"
          while :; do
            case "$(uname -s)" in
              Darwin) mode=$(stat -f '%Op' "$dir") ;;
              Linux) mode=$(stat -c '%a' "$dir") ;;
              *) echo 'unsupported workspace permission venue' >&2; exit 1 ;;
            esac
            if (( (8#$mode & 0022) != 0 && (8#$mode & 01000) == 0 )); then echo "runner $RUNNER_NAME: group/other-writable directory without sticky bit: $dir" >&2; exit 1; fi
            [ "$dir" != / ] || break
            dir=${dir%/*}
            dir=${dir:-/}
          done
      # cache-bin: false is load-bearing on a persistent self-hosted runner
      # (the `breakage` job's comment says why).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { cache-bin: "false" }
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with: { tool: cargo-nextest@0.9.143 }
      # Mandatory: this complete dedicated-ext4 hosted venue still needs qualification.
      - name: supported authority venue, persistent composition, shipping exclusion and exact coverage
        shell: bash
        run: |
          set -euo pipefail
          venue=$(mktemp -d "$RUNNER_TEMP/gran-publish-restart.XXXXXXXX")
          image="$venue/authority.img"
          mount="$venue/ext4"
          cleanup() {
            local status=$?
            trap - EXIT
            if mountpoint -q "$mount"; then
              timeout 10 sudo umount -- "$mount" || status=1
            fi
            attached=$(sudo losetup --associated "$image" --noheadings --output NAME) || status=1
            if mountpoint -q "$mount" || [ -n "$attached" ]; then
              echo 'publish-restart ext4 test venue survived cleanup' >&2
              exit 1
            fi
            rm -rf -- "$venue"
            exit "$status"
          }
          trap cleanup EXIT
          mkdir "$mount"
          truncate -s 2G "$image"
          mkfs.ext4 -q -F "$image"
          sudo mount -t ext4 -o loop,data=ordered,barrier=1 "$image" "$mount"
          sudo chown "$(id -u):$(id -g)" -- "$mount"
          chmod 700 "$mount"
          findmnt -M "$mount" -o TARGET,SOURCE,FSTYPE,OPTIONS
          df -h "$mount"
          TMPDIR="$mount" scripts/publish-restart.sh
      - name: no server may survive this job
        if: always()
        run: python3 -I scripts/check-server-processes.py check --cleanup --state "$RUNNER_TEMP/server-processes.json"
  overlay-faults:
