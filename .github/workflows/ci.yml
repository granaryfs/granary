        if: always()
        run: python3 -I scripts/check-server-processes.py check --cleanup --state "$RUNNER_TEMP/server-processes.json"
  candidate-identity:
    permissions: {}
    uses: ./.github/workflows/public-ci-candidate.yml
  ci-green:                       # Required fan-in: failures and skipped workers refuse.
    needs: [lint, test, test-macos, candidate-identity, purity, gates, breakage, crash-points, publish-restart, overlay-faults, fuse, changes]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: check runner workspace permissions
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE"
          while :; do
            case "$(uname -s)" in
              Darwin) mode=$(stat -f '%Op' "$dir") ;;
              Linux) mode=$(stat -c '%a' "$dir") ;;
              *) echo 'unsupported workspace permission venue' >&2; exit 1 ;;
            esac
            if (( (8#$mode & 0022) != 0 && (8#$mode & 01000) == 0 )); then echo "runner $RUNNER_NAME: group/other-writable directory without sticky bit: $dir" >&2; exit 1; fi
            [ "$dir" != / ] || break
            dir=${dir%/*}
            dir=${dir:-/}
          done
      - name: needs list is complete
        # a job added later but missing from needs would be invisible to the
        # gate below — assert needs == all job ids minus ci-green
        run: |
          python3 -I - <<'EOF'
          import yaml
          wf = yaml.safe_load(open(".github/workflows/ci.yml"))
          jobs = set(wf["jobs"]) - {"ci-green"}
          needs = set(wf["jobs"]["ci-green"]["needs"])
          assert needs == jobs, f"ci-green needs {sorted(needs)} != workflow jobs {sorted(jobs)}"
          print(f"needs list complete: {sorted(needs)}")
          EOF
      - name: upstream results succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'EOF'
          import json, os, runpy
          needs = json.loads(os.environ["NEEDS_JSON"])
          expected = set(runpy.run_path("scripts/ci-changes.py")["worker_ids"]()) | {"changes"}
          if not isinstance(needs, dict) or set(needs) != expected:
              raise SystemExit("upstream job inventory differs")
          if any(not isinstance(job, dict) or job.get("result") != "success" for job in needs.values()):
              raise SystemExit("all upstream jobs must succeed")
          EOF
