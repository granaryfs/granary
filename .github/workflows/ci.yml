    runs-on: ubuntu-24.04
    # 23.4 min measured maximum before the simulator's engine suite joined,
    # whose three largest rows run serially (about 8 min, sync-large-fixtures).
    timeout-minutes: 45
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: check runner workspace permissions
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE"
          while :; do
            case "$(uname -s)" in
              Darwin) mode=$(stat -f '%Op' "$dir") ;;
              Linux) mode=$(stat -c '%a' "$dir") ;;
              *) echo 'unsupported workspace permission venue' >&2; exit 1 ;;
            esac
            if (( (8#$mode & 0022) != 0 && (8#$mode & 01000) == 0 )); then echo "runner $RUNNER_NAME: group/other-writable directory without sticky bit: $dir" >&2; exit 1; fi
            [ "$dir" != / ] || break
            dir=${dir%/*}
            dir=${dir:-/}
          done
      # cache-bin: false is load-bearing on a persistent self-hosted runner
      # (the `breakage` job's comment says why).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { cache-bin: "false" }
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with: { tool: cargo-nextest@0.9.143 }
      - run: ./scripts/check-overlay-faults.sh
        env:
          GRANARY_REQUIRE_DISCARD_CUSTODY: '1'
          # A full slot has 4 vCPU and 16 GiB (the script defaults to one job
          # for shared local machines). In an 8 GiB container the
          # granary-client test build was killed above two jobs.
          GRANARY_OVERLAY_JOBS: '2'
  crash-points:
    # The three `crash-points` gates, in the `breakage` job's form: the
    # feature-on clippy of granary-server, its feature-on suite (with a
    # count guard on the crash-named set, which includes the SIGKILL crash
    # harness), and the release wall that must FAIL to compile.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: record server process baseline
        run: python3 -I scripts/check-server-processes.py begin --state "$RUNNER_TEMP/server-processes.json" --root "$GITHUB_WORKSPACE" --root "$RUNNER_TEMP"
      - name: check runner workspace permissions
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE"
          while :; do
            case "$(uname -s)" in
              Darwin) mode=$(stat -f '%Op' "$dir") ;;
              Linux) mode=$(stat -c '%a' "$dir") ;;
              *) echo 'unsupported workspace permission venue' >&2; exit 1 ;;
            esac
            if (( (8#$mode & 0022) != 0 && (8#$mode & 01000) == 0 )); then echo "runner $RUNNER_NAME: group/other-writable directory without sticky bit: $dir" >&2; exit 1; fi
            [ "$dir" != / ] || break
            dir=${dir%/*}
            dir=${dir:-/}
          done
      # cache-bin: false is load-bearing on a persistent self-hosted runner
      # (the `breakage` job's comment says why).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { cache-bin: "false" }
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with: { tool: cargo-nextest@0.9.143 }
      - run: cargo clippy -p granary-server --all-targets --features crash-points,overlay-fault-tests
      # authority_host spawns gran beside granary-server.
      - run: cargo build --locked -p granary-cli --bin gran
      - name: the crash harness and its eleven portable controls are selected, then the feature-on suite runs
        # The count guard and its sanitising are the `breakage` job's, for
        # the same reasons.
        run: |
          set -euo pipefail
          set +e
          listing=$(cargo nextest list -p granary-server --locked --features crash-points,overlay-fault-tests -E 'test(/crash/)' 2>&1)
          list_rc=$?
          set -e
          if [ "$list_rc" -ne 0 ]; then
            echo "cargo nextest list itself failed (rc=$list_rc):" >&2
            printf '%s\n' "$listing" >&2
            exit 1
          fi
          selected=$(printf '%s\n' "$listing" | grep -c 'the_kill_holds_at_every_point' || true)
          case "$selected" in
            ''|*[!0-9]*) selected=0 ;;
          esac
          if [ "$selected" -eq 0 ]; then
            echo "-E 'test(/crash/)' did not select the SIGKILL crash harness; the run would pass without it" >&2
            exit 1
          fi
          portable=$(printf '%s\n' "$listing" | grep -c 'convergence::server_crash::server_crash_' || true)
          case "$portable" in
            ''|*[!0-9]*) portable=0 ;;
          esac
          if [ "$portable" -ne 11 ]; then
            echo "expected 11 portable server-crash controls, selected $portable" >&2
            exit 1
          fi
          echo "crash harness and 11 portable server-crash controls selected"
          cargo nextest run -p granary-server --profile ci --locked --features crash-points,overlay-fault-tests
      - name: the release wall holds
        # The feature-on release build must FAIL, and the wall's own message
        # must be why (a `case` match, as in the `breakage` job).
        run: |
          set -euo pipefail
          set +e
          log=$(cargo build --release -p granary-server --features crash-points 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "cargo build --release -p granary-server --features crash-points SUCCEEDED: the release wall is gone or its cfg predicate no longer matches" >&2
            exit 1
          fi
          case "$log" in
            *'crash-points must never compile into a release binary'*)
              echo "the release wall held: the feature-on release build failed with its own message"
              ;;
            *)
              echo "the release build failed, but NOT with the release wall's message; last lines:" >&2
              printf '%s\n' "$log" | tail -20 >&2
              exit 1
              ;;
          esac
      - name: no server may survive this job
        if: always()
        run: python3 -I scripts/check-server-processes.py check --cleanup --state "$RUNNER_TEMP/server-processes.json"
  fuse:
    # Run the mounted suites as root on a disposable Linux VM. Keep every
    # root-owned artifact under the per-run tmpfs and every long-lived process
    # in its transient systemd unit. The reap and final checks still prove
    # that no process or mount survives, including after failed test steps.
    # The mount-table helper refuses unreadable evidence and matches both
    # the per-run prefix and Granary FUSE sources without touching outsiders.
    runs-on: ubuntu-24.04
    # This budget includes runner setup, the build, mounted tests and teardown.
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' && inputs.posix_conformance) && 75 || 55 }}
    permissions: { contents: read }
    env:
      GRAN_CI_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      GRAN_CI_RUN: /run/gran-ci/${{ github.run_id }}-${{ github.run_attempt }}
      GRAN_CI_MOUNT: /run/gran-ci/${{ github.run_id }}-${{ github.run_attempt }}/mnt
      GRAN_CI_POSIX: /var/tmp/gran-ci-posix/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: record hosted venue and require the FUSE device
        run: |
          set -euo pipefail
          uname -a
          systemctl --version
          lscpu
          free -h
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          findmnt -T "$GITHUB_WORKSPACE" -o TARGET,SOURCE,FSTYPE,OPTIONS
          findmnt -T /run -o TARGET,SOURCE,FSTYPE,OPTIONS
          if [ -r /sys/fs/cgroup/memory.max ]; then cat /sys/fs/cgroup/memory.max; fi
          if [ ! -c /dev/fuse ]; then sudo modprobe fuse; fi
          test -c /dev/fuse
          stat -c 'FUSE device: %F %a %U:%G' /dev/fuse
          type -a fusermount3 || true
      - name: record server process baseline
        run: python3 -I scripts/check-server-processes.py begin --state "$RUNNER_TEMP/server-processes.json" --root "$GITHUB_WORKSPACE" --root "$RUNNER_TEMP"
      - name: check runner workspace permissions
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE"
          while :; do
            case "$(uname -s)" in
              Darwin) mode=$(stat -f '%Op' "$dir") ;;
              Linux) mode=$(stat -c '%a' "$dir") ;;
              *) echo 'unsupported workspace permission venue' >&2; exit 1 ;;
            esac
            if (( (8#$mode & 0022) != 0 && (8#$mode & 01000) == 0 )); then echo "runner $RUNNER_NAME: group/other-writable directory without sticky bit: $dir" >&2; exit 1; fi
            [ "$dir" != / ] || break
            dir=${dir%/*}
            dir=${dir:-/}
          done
      # LOAD-BEARING, and the FIRST thing this job does after checkout (it
      # needs the helper script; the lane's root is outside the runner's
      # _work tree, so a leaked mount cannot break checkout): the only guard
      # that runs regardless of how the previous job on this runner died.
      # Units first (an orphaned daemon or suite scope is stopped, not left to
      # keep mounting), then every mount under the lane's directory or with
      # granary's source anywhere, each lazily unmounted with its FUSE
      # connection aborted, then the directory. The helper refuses (exit 2)
      # rather than reporting clean when the mount table cannot be read.
      - name: reap any unit or mount a previous job on this runner leaked
        run: |
          set -euo pipefail
          sudo mkdir -p /run/gran-ci
          echo "gran-ci units loaded before the reap: $(systemctl list-units --all --plain --no-legend 'gran-ci-*' | tr -s ' \n' ' ' | sed 's/ $//')"
          # `|| true` on the stop, exactly as the teardown does: this step's
          # WHOLE purpose is the cleanup below it, and a unit that refuses to
          # stop must not be the reason the reap never runs. The hard gate at
          # the end of the job is what fails on a survivor.
          sudo systemctl stop 'gran-ci-*' || echo "a gran-ci unit refused to stop; the reap below runs anyway" >&2
          sudo ./scripts/ci-mounts.sh reap --under /run/gran-ci --gran
          sudo ./scripts/ci-mounts.sh reap --under /var/tmp/gran-ci-posix
          # The DIRECTORY, not a glob of its contents: `*` skips dotfiles, and
          # with nothing to match it stays literal and removes nothing at all,
          # so a leaked hidden entry would survive every reap. The mounts under
          # it are already gone by the line above.
          sudo rm -rf /run/gran-ci /var/tmp/gran-ci-posix
          sudo mkdir -p /run/gran-ci
          echo "reap complete"
      # The helper's own negatives, on the runner it runs on: every refusal
      # fires, an impostor (source gran on tmpfs) does not match, an outsider
      # above the prefix survives, and planted mounts under a path with a
      # space and a backslash are reaped deepest first.
      - name: the mount-table helper proves its own controls on this runner
        run: sudo ./scripts/ci-mounts.sh --self-test --under "$GRAN_CI_RUN/selftest"
      # cache-bin: false is LOAD-BEARING on a persistent self-hosted runner.
      # The post step otherwise prunes ${CARGO_HOME}/bin and deletes rustup
      # itself, leaving cargo/rustc/rustfmt as dangling symlinks — measured
      # 2026-08-16, toolchain destroyed after ONE job. Harmless on hosted
      # runners, which are discarded anyway, so set it unconditionally.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { cache-bin: "false" }
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with: { tool: cargo-nextest@0.9.143 }
      # Match lint's cache key so the stack harness can reuse the pinned MinIO binary.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/minio/minio-*
          key: minio-RELEASE.2025-09-07T16-13-09Z-linux-amd64
      # A braced group, not a one-liner: `a || b && c` binds left to right,
      # so with fusermount3 PRESENT the `||` would short-circuit the update
      # and the trailing `&&` would then install anyway, every run.
      - name: fuse3, idempotently
        run: |
          command -v fusermount3 >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y fuse3
          }
      - name: strace, idempotently
        run: |
          command -v strace >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y strace
          }
      # UNPRIVILEGED, both of them: the stack needs `gran` AND `granary-server`
      # from target/debug, and the suite is archived here so that the root
      # run below needs no cargo and writes nothing under the checkout.
      - name: build the client and the server, and archive the fuse suite
        id: fuse-build
        run: |
          set -euo pipefail
          cargo build --locked -p granary-cli -p granary-client -p granary-server
          cargo build --locked -p granary-cli --bin gran --features conformance-breakage \
            --target-dir "$RUNNER_TEMP/stderr-armed"
          cargo nextest archive --locked -p granary-fuse --archive-file "$RUNNER_TEMP/fuse-tests.tar.zst"
          # The writable mount's Linux rows live in granary-client's library
          # tests. Only that one binary is archived, and only those rows run
          # as root: the whole client archive overflows the extract directory
          # and would run the client suite as root.
          cargo nextest archive --locked -p granary-client --lib --archive-file "$RUNNER_TEMP/fuse-client-tests.tar.zst"
          # The daemon's own Linux rows live in the `gran` binary's unit
          # tests. The fault feature admits their in-process writable authority;
          # granary-client's release wall keeps it out of shipping artifacts.
          cargo nextest archive --locked -p granary-cli --bin gran --features overlay-fault-tests --archive-file "$RUNNER_TEMP/fuse-daemon-tests.tar.zst"
          # The mounted authority harness forwards client fault instrumentation
          # only in this isolated invocation and target directory. No shipping
          # gran artifact is built in, or read from, this feature graph.
          cargo nextest archive --locked -p granary-server --lib \
            --features overlay-fault-tests,crash-points --target-dir "$RUNNER_TEMP/convergence-target" \
            --archive-file "$RUNNER_TEMP/fuse-convergence-tests.tar.zst"
      - name: stand the stack up, mount, read the sentinel, and run the fuse suite as root
        run: |
          set -euo pipefail
          job_user="$(id -un)"
          unit="gran-ci-$GRAN_CI_ID"
          # The run directory is its OWN tmpfs, mounted here: /run is mounted
          # noexec on this distribution, so a test binary extracted under it
          # cannot execute (measured: EACCES from nextest's double-spawn). A
          # tmpfs of our own carries no such flag, bounds the run's footprint,
          # and is one more mount under the lane's root that the reap and the
          # hard gate already cover. 3 GiB holds each extracted archive (they are unpacked in turn) plus the workspace export: the
          # client library's test binary alone outgrew 1 GiB in October 2026
          # (ENOSPC unpacking it), and a full slot has 16 GiB of memory.
          sudo mkdir -p "$GRAN_CI_RUN"
          sudo mount -t tmpfs -o size=3g,mode=0755 tmpfs "$GRAN_CI_RUN"

          # The published tree: one sentinel whose bytes carry THIS run's id,
          # so a mount left by an earlier run cannot satisfy this run's read.
          mkdir -p "$RUNNER_TEMP/src"
          printf 'gran-ci sentinel %s\n' "$GRAN_CI_ID" > "$RUNNER_TEMP/src/sentinel.txt"

          # The stack (MinIO, TLS with a pin, granary-server, a publish), as
          # the job user but INSIDE a transient scope: `start` backgrounds two
          # processes and exits, and a job cancelled before teardown would
          # otherwise orphan them under KillMode=process. The volume name is
          # not `gran-ci`: names with a `gran-` prefix are reserved.
          sudo systemd-run --scope --quiet --unit="$unit-stack" --collect \
            sudo -u "$job_user" -- ./scripts/stack.sh start \
              --source-dir "$RUNNER_TEMP/src" --volume ci --state-dir "$RUNNER_TEMP/stack" \
            > "$RUNNER_TEMP/stack.env"

          # The env file is a frozen four-line contract; validated BEFORE it
          # is sourced: exactly four lines, these names in this order, values
          # in a charset with no shell meaning.
          mapfile -t lines < "$RUNNER_TEMP/stack.env"
          [ "${#lines[@]}" -eq 4 ] || { echo "stack.env: expected 4 lines, got ${#lines[@]}" >&2; exit 1; }
          names=(GRAN_ENDPOINT GRAN_PIN GRAN_ROOT_KEY GRAN_VOLUME)
          for i in 0 1 2 3; do
            [[ "${lines[$i]}" =~ ^${names[$i]}=[][A-Za-z0-9._:/+=@%,-]+$ ]] \
              || { echo "stack.env line $((i + 1)) violates the contract: ${lines[$i]}" >&2; exit 1; }
          done
          . "$RUNNER_TEMP/stack.env"

          # Real blocked pipes and mounts in the host namespace. The conformance
          # executable has its own target so it cannot replace the honest gran.
          # The suite scope joins the existing cancellation/reap containment.
          bash scripts/blocked-stderr.sh --self-test-witnesses
          printf -v stderr_sentinel 'gran-ci sentinel %s\n' "$GRAN_CI_ID"
          set +e
          sudo systemd-run --scope --quiet --unit="$unit-stderr" --collect \
            bash "$GITHUB_WORKSPACE/scripts/blocked-stderr.sh" run \
              "$RUNNER_TEMP/stderr-armed/debug/gran" "$RUNNER_TEMP/stack.env" \
              "$stderr_sentinel" "$GRAN_CI_RUN/stderr" \
            >"$RUNNER_TEMP/blocked-stderr.log" 2>&1
          stderr_rc=$?
          set -e
          cat "$RUNNER_TEMP/blocked-stderr.log"
          [ "$stderr_rc" -eq 0 ] || { echo "stderr battery failed: rc=$stderr_rc" >&2; exit 1; }
          bash scripts/blocked-stderr.sh --check-log "$RUNNER_TEMP/blocked-stderr.log" fixed

          # The mount, as root, in a transient service. ABSOLUTE binary path:
          # systemd resolves a relative one against WorkingDirectory, which
          # defaults to `/`. --root-key is not a choice: a machine-wide entry
          # point requires a publisher signature. A bounded stop timeout so a
          # hung daemon cannot hold the teardown for systemd's 90 s default.
          sudo mkdir -p "$GRAN_CI_MOUNT" "$GRAN_CI_RUN/cache"
          sudo systemd-run --quiet --unit="$unit" --collect \
            --property=Type=simple --property=TimeoutStopSec=30 \
            "$GITHUB_WORKSPACE/target/debug/gran" mount "$GRAN_VOLUME" "$GRAN_CI_MOUNT" \
              --endpoint "$GRAN_ENDPOINT" --pin "$GRAN_PIN" \
              --root-key "$GRAN_ROOT_KEY" --cache-dir "$GRAN_CI_RUN/cache" \
              --foreground

          # READINESS: Type=simple returns the instant the process forks, so
          # bound-poll the mount table for a row AT the mountpoint whose
          # source is gran and whose fstype is fuse (this route) or fuse.gran
          # (the unprivileged one). The unit is checked in the SAME iteration,
          # so a daemon that died fails in one poll with its journal printed,
          # not after the whole bound. `findmnt --mountpoint` exits 1 while
          # the path is not yet a mountpoint, which is the polling case.
          ready=0
          for _ in $(seq 1 120); do
            if ! systemctl is-active --quiet "$unit"; then
              echo "the daemon unit $unit is not active; its journal:" >&2
              sudo journalctl -u "$unit" --no-pager >&2 || true
              exit 1
            fi
            row="$(findmnt -rn -o SOURCE,FSTYPE --mountpoint "$GRAN_CI_MOUNT" 2>/dev/null || true)"
            if [ "$row" = "gran fuse" ] || [ "$row" = "gran fuse.gran" ]; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            echo "no granary mount appeared at $GRAN_CI_MOUNT within 60 s; the daemon's journal:" >&2
            sudo journalctl -u "$unit" --no-pager >&2 || true
            exit 1
          fi
          echo "mount established: $(findmnt -rn -o TARGET,SOURCE,FSTYPE --mountpoint "$GRAN_CI_MOUNT")"

          # THE SENTINEL READ: what turns the mount from decoration into a
          # gate. Through sudo, because a root mount without allow_other is
          # invisible to the job user; under a timeout, because a daemon that
          # mounted and then hung would otherwise park this step until the job
          # timeout; and the bytes must EQUAL the published source file, which
          # carries this run's id.
          set +e
          # `-k 5`: a task blocked in a FUSE request sits in a KILLABLE wait,
          # not an interruptible one, so plain `timeout` would signal, then
          # wait for a child that never dies of SIGTERM and never reach its
          # own 124. The follow-up SIGKILL is what makes the bound real.
          sudo timeout -k 5 30 cmp "$RUNNER_TEMP/src/sentinel.txt" "$GRAN_CI_MOUNT/sentinel.txt"
          cmp_rc=$?
          set -e
          # 124 AND 137. MEASURED on this runner (coreutils 9.4): `timeout -k`
          # exits 124 when the child dies of the first signal, but 137 when the
          # child ignores it and the follow-up SIGKILL is what ends it — which
          # is exactly the FUSE-hang case this bound exists for. Treating 137 as
          # anything else reports a hung mount as a byte mismatch.
          case "$cmp_rc" in
            0) echo "sentinel bytes verified through the mount" ;;
            124|137)
              echo "the sentinel read HUNG for 30 s (timeout rc=$cmp_rc); the daemon's journal:" >&2
              sudo journalctl -u "$unit" --no-pager >&2 || true
              exit 1
              ;;
            *)
              echo "the sentinel read through the mount did not match the published bytes (cmp rc=$cmp_rc)" >&2
              exit 1
              ;;
          esac
          systemctl is-active --quiet "$unit" || { echo "the daemon unit died after the sentinel read" >&2; exit 1; }
          # The sentinel is finished. End its mount before the suite takes
          # its before snapshot and before the optional POSIX step can run.
          sudo systemctl stop "$unit.service"
          sudo ./scripts/ci-mounts.sh check --under "$GRAN_CI_MOUNT"

          # THE SUITE AS ROOT. Its inputs: the archive built unprivileged
          # above; an EXPORTED copy of the workspace (git archive of HEAD,
          # under /run) as the workspace root, so a test that writes relative
          # to its manifest directory writes into tmpfs and never into the
          # checkout; TMPDIR and HOME under /run, so every scratch mount the
          # suite makes is inside the reap domain. Inside a transient scope,
          # so a cancelled job cannot orphan a test daemon. Row 4's cgroup
          # provocation needs a bounded memory.max at the cgroup root, which
          # a bare systemd host never exposes: it NoBudget-skips here, loudly,
          # and a runner that DID expose one is refused rather than throttled.
          # The SAME predicate the test itself applies, not a coarser copy of
          # it: cgroup v2 writes the literal `max` in an unbounded controller,
          # and the test's own reader parses the value and returns NoBudget
          # when it is not a number. Refusing on mere existence would abort the
          # job on a runner where row 4 is harmless.
          if [ -e /sys/fs/cgroup/memory.max ]; then
            ceiling="$(cat /sys/fs/cgroup/memory.max)"
            case "$ceiling" in
              ''|*[!0-9]*) echo "cgroup ceiling is \"$ceiling\": row 4 derives no budget and will skip loudly" ;;
              *) echo "refusing: this runner's /sys/fs/cgroup/memory.max is a bounded $ceiling, and row 4 would throttle the shared cgroup" >&2; exit 1 ;;
            esac
          fi
          sudo mkdir -p "$GRAN_CI_RUN/ws" "$GRAN_CI_RUN/extract" "$GRAN_CI_RUN/tmp"
          # /tmp's own mode: two fusermount-fallback tests drop to an
          # unprivileged uid before creating their scratch directory, and a
          # root-only TMPDIR fails them with EACCES (measured in the container).
          sudo chmod 1777 "$GRAN_CI_RUN/tmp"
          git archive --format=tar HEAD | sudo tar -x -C "$GRAN_CI_RUN/ws"
          nextest="$(command -v cargo-nextest)"
          suite_log="$RUNNER_TEMP/fuse-suite.log"
          before="$(mktemp)"
          cat /proc/self/mountinfo > "$before"
          [ -s "$before" ] || { echo "could not snapshot the mount table before the suite" >&2; exit 1; }
          set +e
          sudo systemd-run --scope --quiet --unit="$unit-suite" --collect \
            env TMPDIR="$GRAN_CI_RUN/tmp" HOME="$GRAN_CI_RUN/tmp" \
            "$nextest" nextest run --archive-file "$RUNNER_TEMP/fuse-tests.tar.zst" \
              --extract-to "$GRAN_CI_RUN/extract" --workspace-remap "$GRAN_CI_RUN/ws" \
              --profile ci --success-output=final > "$suite_log" 2>&1
          suite_rc=$?
          set -e
          cat "$suite_log"
          echo "suite exit status: $suite_rc"
          # The writable mount rows, from their own small archive, extracted
          # once the fuse suite's extraction is no longer needed.
          sudo rm -rf "$GRAN_CI_RUN/extract"
          sudo mkdir -p "$GRAN_CI_RUN/extract"
          client_log="$RUNNER_TEMP/fuse-client-suite.log"
          set +e
          sudo systemd-run --scope --quiet --unit="$unit-client" --collect \
            env TMPDIR="$GRAN_CI_RUN/tmp" HOME="$GRAN_CI_RUN/tmp" GRANARY_SYNC_WIRE_VENUE=1 \
            "$nextest" nextest run --archive-file "$RUNNER_TEMP/fuse-client-tests.tar.zst" \
              --extract-to "$GRAN_CI_RUN/extract" --workspace-remap "$GRAN_CI_RUN/ws" \
              --profile ci --success-output=final -E 'test(writable_linux_)' > "$client_log" 2>&1
          client_rc=$?
          set -e
          cat "$client_log"
          echo "writable rows exit status: $client_rc"
          # The daemon rows, from the third archive, extracted once the
          # client archive's extraction is no longer needed.
          sudo rm -rf "$GRAN_CI_RUN/extract"
          sudo mkdir -p "$GRAN_CI_RUN/extract"
          daemon_log="$RUNNER_TEMP/fuse-daemon-suite.log"
          set +e
          sudo systemd-run --scope --quiet --unit="$unit-daemon" --collect \
            env TMPDIR="$GRAN_CI_RUN/tmp" HOME="$GRAN_CI_RUN/tmp" \
            "$nextest" nextest run --archive-file "$RUNNER_TEMP/fuse-daemon-tests.tar.zst" \
              --extract-to "$GRAN_CI_RUN/extract" --workspace-remap "$GRAN_CI_RUN/ws" \
              --profile ci --success-output=final -E 'test(daemon_linux_)' > "$daemon_log" 2>&1
          daemon_rc=$?
          set -e
          cat "$daemon_log"
          echo "daemon rows exit status: $daemon_rc"
          # The bounded rows compose the server's surviving authority with the
          # CLI libtest daemon. Let nextest extract and list both archives with
          # their archived runtime metadata, then measure the healthy row before
          # any faulted row. The fixed matrix has 25 daemon executions: 4
          # healthy; 4 stalled+4 restarts+4 controls; and 3 graduated+3
          # restarts+3 controls. Per ending_once, reserve 20 s for harness
          # setup/assertions/teardown, 10 s for each readiness or head wait,
          # 18 s for each command or daemon exit, and 7 s for reader close
          # (2 s normal join + 5 s abort join). None has one readiness and
          # three head waits; a faulted case has two readiness and four head
          # waits. Graduated also has a reader call bounded by 10 s plus two
          # 5 s abort-join waits, then another 7 s close. Thus healthy is
          # 2*103+2*85=376 s; stalled is
          # 2*(159+103)+2*(123+85)=940 s; graduated is
          # (186+103)+2*(150+85)=759 s. The 480/1080/900 s watchdogs leave
          # 104/140/141 s; they do not widen B or any row-local bound. The
          # job's own timeout-minutes still caps their sum, and a run that
          # reaches it fails rather than passes.
          bounded_root="$GRAN_CI_RUN/bounded"
          sudo rm -rf "$bounded_root"
          sudo mkdir -p "$bounded_root/cli" "$bounded_root/server"
          bounded_cli_inventory="$RUNNER_TEMP/fuse-bounded-cli-inventory.log"
          bounded_server_inventory="$RUNNER_TEMP/fuse-bounded-server-inventory.log"
          set +e
          sudo env TMPDIR="$GRAN_CI_RUN/tmp" HOME="$GRAN_CI_RUN/tmp" \
            "$nextest" nextest list --archive-file "$RUNNER_TEMP/fuse-daemon-tests.tar.zst" \
              --extract-to "$bounded_root/cli" --workspace-remap "$GRAN_CI_RUN/ws" \
              --message-format oneline --run-ignored all \
              -E 'test(=attach::tests::bounded_unmount::bounded_unmount_child)' \
              > "$bounded_cli_inventory" 2>&1
          bounded_cli_inventory_rc=$?
          sudo env TMPDIR="$GRAN_CI_RUN/tmp" HOME="$GRAN_CI_RUN/tmp" \
            "$nextest" nextest list --archive-file "$RUNNER_TEMP/fuse-convergence-tests.tar.zst" \
              --extract-to "$bounded_root/server" --workspace-remap "$GRAN_CI_RUN/ws" \
              --message-format oneline \
              -E 'test(=conformance_http::intents::convergence::mounted::bounded_unmount::writable_linux_bounded_unmount_healthy)' \
              > "$bounded_server_inventory" 2>&1
          bounded_server_inventory_rc=$?
          set -e
          cat "$bounded_cli_inventory" "$bounded_server_inventory"
          if [ "$bounded_cli_inventory_rc" -ne 0 ] || \
             ! grep -Eq ' attach::tests::bounded_unmount::bounded_unmount_child *$' "$bounded_cli_inventory"; then
            echo "nextest could not list the bounded CLI child (rc=$bounded_cli_inventory_rc)" >&2
            exit 1
          fi
          if [ "$bounded_server_inventory_rc" -ne 0 ] || \
             ! grep -Eq ' conformance_http::intents::convergence::mounted::bounded_unmount::writable_linux_bounded_unmount_healthy *$' "$bounded_server_inventory"; then
            echo "nextest could not list the bounded server row (rc=$bounded_server_inventory_rc)" >&2
            exit 1
          fi
          # The server row starts the CLI libtest itself. Carry both archives'
          # libstd directories and native linked-output directories explicitly;
          # nextest prepends its server paths and the child inherits the result.
          bounded_library_path=''
          while IFS= read -r library_dir; do
            bounded_library_path="${bounded_library_path:+$bounded_library_path:}$library_dir"
          done < <(
            find "$bounded_root/cli/target/nextest/libdirs" \
                 "$bounded_root/server/target/nextest/libdirs" \
              -mindepth 1 -maxdepth 1 -type d -print
            find "$bounded_root/cli/target/debug/build" \
                 "$bounded_root/server/target/debug/build" \
              -type d -name out -print
          )
          [ -n "$bounded_library_path" ] || {
            echo "bounded archives contained no dynamic-library directories" >&2
            exit 1
          }
          bounded_cli=''
          bounded_cli_candidates=0
          while IFS= read -r candidate; do
            bounded_cli_candidates=$((bounded_cli_candidates + 1))
            candidate_log="$RUNNER_TEMP/fuse-bounded-cli-candidate-$bounded_cli_candidates.log"
            set +e
            LD_LIBRARY_PATH="$bounded_library_path" \
              "$candidate" --list > "$candidate_log" 2>&1
            candidate_rc=$?
            set -e
            if [ "$candidate_rc" -ne 0 ]; then
              echo "bounded CLI candidate failed to list: $candidate (rc=$candidate_rc)" >&2
              cat "$candidate_log" >&2
            elif grep -Fq 'attach::tests::bounded_unmount::bounded_unmount_child: test' "$candidate_log"; then
              [ -z "$bounded_cli" ] || { echo "multiple bounded CLI libtests" >&2; exit 1; }
              bounded_cli="$candidate"
            else
              echo "bounded CLI candidate listed but lacks the child row: $candidate" >&2
            fi
          done < <(find "$bounded_root/cli" -type f -perm -0100 -name 'gran-*' -print)
          if [ "$bounded_cli_candidates" -eq 0 ]; then
            echo "bounded CLI archive had no executable gran-* candidate; archive entries:" >&2
            find "$bounded_root/cli" -type f -name 'gran-*' \
              -printf 'mode=%m owner=%u group=%g path=%p\n' >&2
          fi
          [ -n "$bounded_cli" ] || {
            echo "bounded CLI test executable was not usable" >&2
            exit 1
          }
          minio_port="$(cat "$RUNNER_TEMP/stack/minio.port")"
          case "$minio_port" in
            ''|*[!0-9]*) echo "the stack's MinIO port is not numeric" >&2; exit 1 ;;
          esac
          bounded_env=(
            TMPDIR="$GRAN_CI_RUN/convergence-tmp" HOME="$GRAN_CI_RUN/convergence-tmp"
            GRAN_CI_ID="$GRAN_CI_ID"
            LD_LIBRARY_PATH="$bounded_library_path"
            GRANARY_BOUNDED_UNMOUNT_TEST_BINARY="$bounded_cli"
            GRANARY_BOUNDED_UNMOUNT_GRAN="$GITHUB_WORKSPACE/target/debug/gran"
            GRANARY_STORE_BUCKET=granary-test
            GRANARY_STORE_ENDPOINT="http://127.0.0.1:$minio_port"
            GRANARY_STORE_REGION=us-east-1 AWS_ACCESS_KEY_ID=granary-test
            AWS_SECRET_ACCESS_KEY=granary-test-secret
          )
          sudo install -d -m 0700 "$GRAN_CI_RUN/convergence-tmp"
          bounded_healthy_log="$RUNNER_TEMP/fuse-bounded-healthy.log"
          set +e
          sudo systemd-run --scope --quiet --unit="$unit-bounded-healthy" --collect \
            env "${bounded_env[@]}" timeout --kill-after=15 480 \
            "$nextest" nextest run --archive-file "$RUNNER_TEMP/fuse-convergence-tests.tar.zst" \
              --extract-to "$bounded_root/server" --extract-overwrite \
              --workspace-remap "$GRAN_CI_RUN/ws" --profile ci --success-output=final \
              --status-level pass --final-status-level none \
              -E 'test(=conformance_http::intents::convergence::mounted::bounded_unmount::writable_linux_bounded_unmount_healthy)' \
              > "$bounded_healthy_log" 2>&1
          bounded_healthy_rc=$?
          set -e
          cat "$bounded_healthy_log"
          bounded_fault_log="$RUNNER_TEMP/fuse-bounded-fault.log"
          set +e
          sudo systemd-run --scope --quiet --unit="$unit-bounded-stalled" --collect \
            env "${bounded_env[@]}" timeout --kill-after=15 1080 \
            "$nextest" nextest run --archive-file "$RUNNER_TEMP/fuse-convergence-tests.tar.zst" \
              --extract-to "$bounded_root/server" --extract-overwrite \
              --workspace-remap "$GRAN_CI_RUN/ws" --profile ci --success-output=final \
              --status-level pass --final-status-level none \
              -E 'test(=conformance_http::intents::convergence::mounted::bounded_unmount::writable_linux_bounded_unmount_stalled)' \
              > "$bounded_fault_log" 2>&1
          bounded_stalled_rc=$?
          sudo systemd-run --scope --quiet --unit="$unit-bounded-graduated" --collect \
            env "${bounded_env[@]}" timeout --kill-after=15 900 \
            "$nextest" nextest run --archive-file "$RUNNER_TEMP/fuse-convergence-tests.tar.zst" \
              --extract-to "$bounded_root/server" --extract-overwrite \
              --workspace-remap "$GRAN_CI_RUN/ws" --profile ci --success-output=final \
              --status-level pass --final-status-level none \
              -E 'test(=conformance_http::intents::convergence::mounted::bounded_unmount::writable_linux_bounded_unmount_graduated)' \
              >> "$bounded_fault_log" 2>&1
          bounded_graduated_rc=$?
          set -e
          cat "$bounded_fault_log"
          sudo rm -rf "$bounded_root"
          # The authority convergence rows, after the previous archive's
          # extraction has been removed from the bounded run tmpfs. MinIO is
          # passed by name; no ambient object-store configuration is consulted.
          sudo rm -rf "$GRAN_CI_RUN/extract"
          sudo mkdir -p "$GRAN_CI_RUN/extract"
          # Its own root-only scratch: the rows keep a signing seed there, and
          # the seed custody walk refuses the shared 1777 tmp above.
          sudo install -d -m 0700 "$GRAN_CI_RUN/convergence-tmp"
          convergence_log="$RUNNER_TEMP/fuse-convergence-suite.log"
          set +e
          sudo systemd-run --scope --quiet --unit="$unit-convergence" --collect \
            env TMPDIR="$GRAN_CI_RUN/convergence-tmp" HOME="$GRAN_CI_RUN/convergence-tmp" GRAN_CI_ID="$GRAN_CI_ID" \
              GRANARY_DISK_LOSS_GRAN="$GITHUB_WORKSPACE/target/debug/gran" \
              GRANARY_STORE_BUCKET=granary-test \
              GRANARY_STORE_ENDPOINT="http://127.0.0.1:$minio_port" \
              GRANARY_STORE_REGION=us-east-1 AWS_ACCESS_KEY_ID=granary-test \
              AWS_SECRET_ACCESS_KEY=granary-test-secret \
