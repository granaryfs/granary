          owned="$(sudo find "$GITHUB_WORKSPACE" ! -user "$(id -u)" -print)"
          if [ -n "$owned" ]; then
            echo "entries in the workspace owned by someone other than $(id -un) (repaired for the next job, and a defect in this one):" >&2
            printf '%s\n' "$owned" >&2
            sudo find "$GITHUB_WORKSPACE" ! -user "$(id -u)" -exec chown -h "$(id -u):$(id -g)" {} +
