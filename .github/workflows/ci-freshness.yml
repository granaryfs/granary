name: ci-freshness
on:
  schedule:
    - cron: '47 */3 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-freshness
  cancel-in-progress: false
jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { actions: read, contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: completed full main CI is fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I scripts/check-ci-freshness.py --public --self-test
          python3 -I scripts/check-ci-freshness.py --public
